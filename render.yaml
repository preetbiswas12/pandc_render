services:
  - type: web
    name: fabric-store
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    staticPublishPath: dist

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase
      - key: VITE_SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false  # Set in Render dashboard
      # Razorpay (optional)
      - key: VITE_RAZORPAY_KEY_ID
        sync: false  # Set in Render dashboard (public key only)
      # App config
      - key: VITE_APP_NAME
        value: P&c Texfab
      - key: VITE_APP_URL
        value: https://pandctexfab.com
      - key: VITE_ADMIN_EMAIL
        value: admin@pandctexfab.com
      - key: VITE_ADMIN_PASSWORD
        sync: false  # Set in Render dashboard
      - key: VITE_CURRENCY_SYMBOL
        value: ₹
      - key: VITE_CURRENCY_CODE
        value: INR
      - key: VITE_BUSINESS_EMAIL
        value: pandctexfab@gmail.com
      - key: VITE_BUSINESS_PHONE
        value: +91-9876543210
      - key: VITE_FREE_SHIPPING_THRESHOLD
        value: "2000"
      - key: VITE_STANDARD_SHIPPING_COST
        value: "100"
      - key: VITE_TAX_RATE
        value: "0"

    # Auto-deploy when main branch is updated
    autoDeploy: true
